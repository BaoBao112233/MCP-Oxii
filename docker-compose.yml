version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    env_file:
      - .env
    depends_on:
      - tmp
      - tool-1
      - tool-2
    volumes:
      - ./memories:/app/memories
      # - ./template:/app/template
    networks:
      - template-network
    restart: unless-stopped

  # Template MCP Server
  tmp:
    build:
      context: ./mcp-servers/tmp
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - ./mcp-servers/tmp:/app
    networks:
      - template-network
    restart: unless-stopped

  # Tool 1 MCP Server
  tool-1:
    build:
      context: ./mcp-servers/tool-1
      dockerfile: Dockerfile
    ports:
      - "9011:9011"
    volumes:
      - ./mcp-servers/tool-1:/app
    networks:
      - template-network
    restart: unless-stopped

  # Tool 2 MCP Server
  tool-2:
    build:
      context: ./mcp-servers/tool-2
      dockerfile: Dockerfile
    ports:
      - "9021:9021"
    volumes:
      - ./mcp-servers/tool-2:/app
    networks:
      - template-network
    restart: unless-stopped

networks:
  template-network:
    driver: bridge 