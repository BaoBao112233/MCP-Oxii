[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mcp-server]
command=python main.py
directory=/app/mcp-server
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/mcp-server.err.log
stdout_logfile=/var/log/supervisor/mcp-server.out.log
environment=PORT=9031

[program:temp-api]
command=python main.py
directory=/app/temp-api
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/temp-api.err.log
stdout_logfile=/var/log/supervisor/temp-api.out.log
environment=PORT=8000

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log