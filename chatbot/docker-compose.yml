version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app/service-account.json:/app/service-account.json:ro
      # - ./template:/app/template
    networks:
      - template-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - template-network
    restart: unless-stopped

networks:
  template-network:
    driver: bridge 

volumes:
  redis-data: